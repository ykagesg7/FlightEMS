<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Fingertip と Route 編隊模式図</title>
  <desc id="desc">長機とウイングマンの Fingertip および Route 隊形の上から見た模式図。細部はブリーフィングに従う。</desc>
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .panel-title { fill: #e8f4f8; font-family: system-ui, sans-serif; font-size: 22px; font-weight: 700; }
      .label { fill: #a8dadc; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; }
      .note { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 15px; }
      .guide { stroke: #4fd1c5; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; opacity: 0.55; }
      .pom { stroke: #fbbf24; stroke-width: 2; fill: none; opacity: 0.75; }
      .air-lead { fill: #38bdf8; }
      .air-wing { fill: #2dd4bf; }
      .wing-bar { stroke: #f8fafc; stroke-width: 2.2; stroke-linecap: round; }
      .divider { stroke: #334155; stroke-width: 1; }
    </style>
    <g id="aircraft-up">
      <path class="air-lead" d="M0,-18 L7,14 L0,6 L-7,14 Z"/>
      <line class="wing-bar" x1="-14" y1="4" x2="14" y2="4"/>
    </g>
    <g id="aircraft-up-wing">
      <path class="air-wing" d="M0,-16 L6,12 L0,5 L-6,12 Z"/>
      <line class="wing-bar" x1="-12" y1="3" x2="12" y2="3"/>
    </g>
  </defs>
  <rect class="bg" width="1200" height="630"/>
  <line class="divider" x1="600" y1="48" x2="600" y2="560"/>

  <!-- Fingertip panel -->
  <text class="panel-title" x="72" y="64">Fingertip（フィンガーチップ）</text>
  <text class="note" x="72" y="92">上から見た模式図（学習用）</text>
  <line class="guide" x1="200" y1="360" x2="430" y2="360"/>
  <use href="#aircraft-up" transform="translate(260,320)"/>
  <text class="label" x="248" y="288">長機</text>
  <use href="#aircraft-up-wing" transform="translate(390,355)"/>
  <text class="label" x="372" y="400">ウイングマン</text>
  <path class="guide" d="M 278 324 L 378 348"/>
  <text class="note" x="72" y="470">主翅前縁の延長に合わせ、翅端クリアランスを保つタイトな隊形</text>

  <!-- Route panel -->
  <text class="panel-title" x="648" y="64">Route（ルート）</text>
  <text class="note" x="648" y="92">間隔を広げた「箱」の中の居場所</text>
  <use href="#aircraft-up" transform="translate(720,260)"/>
  <text class="label" x="708" y="228">長機</text>
  <use href="#aircraft-up-wing" transform="translate(980,330)"/>
  <text class="label" x="952" y="378">ウイングマン</text>
  <rect class="guide" x="680" y="210" width="380" height="200" rx="8"/>

  <!-- Route turn / stack down inset -->
  <text class="panel-title" x="648" y="430" font-size="18">旋回時（内側のウイングマン）</text>
  <path class="pom" d="M 700 520 A 90 90 0 0 1 880 520"/>
  <use href="#aircraft-up" transform="translate(790,505) rotate(35)"/>
  <use href="#aircraft-up-wing" transform="translate(845,535) rotate(20)"/>
  <text class="label" x="860" y="568" font-size="14">Stack down（スタックダウン）</text>
  <text class="note" x="648" y="598">Plane of Motion（プレーン・オブ・モーション）より下に位置するイメージ</text>

  <text class="note" x="600" y="622" text-anchor="middle">細かいところはブリーフィングに従う</text>
</svg>
